[pytest]
# Configurazione della suite di test del Project Work 24.

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -r a        riepiloga tutti gli esiti non superati a fine esecuzione
# --strict-markers   impedisce l'uso di marcatori non dichiarati (errori di battitura)
# --tb=short  traceback compatti, piu' leggibili in sede di dimostrazione
addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    slow: test piu' lenti (dashboard headless tramite streamlit AppTest)

# Streamlit e le sue dipendenze emettono avvisi di deprecazione non
# riconducibili al codice del progetto: vengono silenziati per mantenere
# leggibile l'output dei test.
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:altair.*
